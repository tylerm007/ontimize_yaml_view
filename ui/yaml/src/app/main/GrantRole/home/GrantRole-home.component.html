<o-form-layout-manager attr="GrantRole" mode="dialog" title="GRANTROLE">
    <div fxFill fxLayout="column" fxLayoutAlign="start">
        <o-table attr="GrantRoleTable" service="GrantRole" entity="GrantRole" title="GRANTROLE"
            keys="entity_name;role_name"
            columns="entity_name;role_name;can_insert;can_update;can_delete;filter;filter_debug;can_read"
            header-actions="R;D"
            visible-columns="entity_name;role_name;can_read;can_insert;can_update;can_delete;filter"
            sort-columns="entity_name" query-rows="20" quick-filter="yes" row-height="medium" select-all-checkbox="true"
            pageable="yes" auto-adjust="true" virtual-scroll="yes" edition-mode="dblclick" horizontal-scroll="yes"
            show-title="yes" export-button="yes">

            <o-table-column attr="entity_name" title="Entity Name">
            </o-table-column>



            <o-table-column attr="role_name" title="Role Name">
            </o-table-column>
            <o-table-column #can_read attr="can_read" title="can_read" editable="no" required="no" content-align="left">
                <o-table-cell-renderer-boolean render-true-value="check_circle" render-false-value="highlight_off"
                    render-type="icon" boolean-type="boolean" true-value="true"
                    false-value="false"></o-table-cell-renderer-boolean>
            </o-table-column>

            <o-table-column #can_insert attr="can_insert" title="can_insert" editable="no" required="no" content-align="left">
                <o-table-cell-renderer-boolean render-true-value="check_circle" render-false-value="highlight_off"
                    render-type="icon" boolean-type="boolean" true-value="true"
                    false-value="false"></o-table-cell-renderer-boolean>
            </o-table-column>

            <o-table-column #can_update attr="can_update" label="can_update" editable="no" required="no">
                <o-table-cell-renderer-boolean render-true-value="check_circle" render-false-value="highlight_off"
                    render-type="icon" boolean-type="boolean" true-value="true"
                    false-value="false"></o-table-cell-renderer-boolean>
            </o-table-column>

            <o-table-column #can_delete attr="can_delete" title="can_delete" editable="no" required="no"
                content-align="left">
                <o-table-cell-renderer-boolean render-true-value="check_circle" render-false-value="highlight_off"
                    render-type="icon" boolean-type="boolean" true-value="true"
                    false-value="false"></o-table-cell-renderer-boolean>
            </o-table-column>

            <o-table-column #filter attr="filter" title="Filter" editable="no" required="no"
                content-align="left"></o-table-column>

            <!--o-table-column #filter_debug attr="filter_debug" title="Filter Debug" editable="no" required="no"
                content-align="left"></o-table-column -->


            <o-table-context-menu></o-table-context-menu>
            <o-table-paginator page-size-options="24;48;96"></o-table-paginator>
        </o-table>
    </div>
</o-form-layout-manager>
