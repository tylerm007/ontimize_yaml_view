<o-form #GrantRoleForm attr="GrantRole_form_insert" service="GrantRole" entity="GrantRole" keys="entity_name;role_name"
        fxLayout="column" show-header="yes" header-actions="I" horizontal-scroll="yes" after-insert-mode="new"
        class="standalone-form-container" (onInsertMode)="onInsertMode()">

        <o-row attr="row1" layout-align="start stretch">
                <o-list-picker attr="entity_name" service="Entity" entity="EntityType" fxFlex="20" query-on-init="no"
                        query-on-bind="yes" required="yes" enabled="yes" filter="yes" value-column="name"
                        value-column-type="VARCHAR" keys="name" columns="name;entity_name" label="Entity Name"
                        visible-columns="name" separator=" - " width="680px" class="form-field">
                </o-list-picker>
                <div layout-padding></div>
                <o-list-picker attr="role_name" service="RbacRole" entity="RbacRoleType" fxFlex="20" query-on-init="no"
                        query-on-bind="yes" required="yes" enabled="yes" filter="yes" value-column="name"
                        value-column-type="VARCHAR" keys="name" columns="name;role_name" label="Role Name"
                        visible-columns="name" separator=" - " width="680px" class="form-field">
                </o-list-picker>

                <o-textarea-input #filter attr="filter" label="Filter" enabled="yes" required="no" fxFlex="30%"
                        class="form-field"></o-textarea-input>
                <div layout-padding></div>
                <o-textarea-input #filter_debug attr="filter_debug" label="Filter Debug" enabled="yes" required="no"
                        fxFlex="30%" class="form-field"></o-textarea-input>

        </o-row>
        <o-row attr="row1" layout-align="start stretch">
                <o-checkbox #can_read attr="can_read" label="can_read" enabled="yes" required="no" fxFlex="10%"
                        class="form-field"></o-checkbox>
                <o-checkbox #can_insert attr="can_insert" label="can_insert" enabled="yes" required="no" fxFlex="10%"
                        class="form-field"></o-checkbox>

                <o-checkbox #can_update attr="can_update" label="can_update" editable="no" required="no" fxFlex="10%"
                        class="form-field"></o-checkbox>

                <o-checkbox #can_delete attr="can_delete" label="can_delete" enabled="yes" required="no" fxFlex="10%"
                        class="form-field"></o-checkbox>


        </o-row>

        <div layout-padding></div>

</o-form>
