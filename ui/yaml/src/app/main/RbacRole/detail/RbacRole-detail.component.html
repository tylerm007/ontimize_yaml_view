<div class="container">
  <o-form-container breadcrumb="yes" breadcrumb-label-columns="name" breadcrumb-separator=", " class="fill-form">
    <o-form #form attr="RbacRole_form_edit" service="RbacRole" entity="RbacRole" fxLayout="column" show-header="yes"
      header-actions="R;I;U;D" #oDetailForm keys="name" keys-sql-types="VARCHAR" show-header-navigation="yes"
      (onDataLoaded)="onDataLoaded($event)">

      <o-row attr="row1" layout-align="start stretch">
        <div fxLayout="row wrap" fxLayoutAlign="start start" fxFlex fxLayoutGap="14px">

          <o-text-input #name attr="name" label=" name*" enabled="yes" required="yes" fxFlex="20%"
            class="form-field"></o-text-input>

          <o-text-input #description attr="description" label="description" enabled="yes" required="no" fxFlex="20%"
            class="form-field"></o-text-input>
    

          <o-checkbox #can_read attr="can_read" label="can_read" enabled="yes" required="no" fxFlex="10%"
            class="form-field"></o-checkbox>

          <o-checkbox #can_insert attr="can_insert" label="can_insert" enabled="yes" required="no" fxFlex="10%"
            class="form-field"></o-checkbox>

          <o-checkbox #can_update attr="can_update" label="can_update" editable="no" required="no"fxFlex="10%"
          class="form-field"></o-checkbox>

          <o-checkbox #can_delete attr="can_delete" label="can_delete" enabled="yes" required="no" fxFlex="10%"
            class="form-field"></o-checkbox>

        </div>
      </o-row>

      <mat-tab-group fxFill>

        <mat-tab label="GRANTROLE-role_name">
          <div layout-padding>
            <o-table attr="GrantRoleTable" service="GrantRole" entity="GrantRole" keys="entity_name;role_name"
              parent-keys="role_name:name"
              columns="entity_name;role_name;can_insert;can_update;can_delete;filter;filter_debug;can_read"
              horizontal-scroll="yes" detail-form-route="GrantRole" edit-form-route="GrantRole"
              visible-columns="entity_name;role_name;can_insert;can_update;can_delete;filter;filter_debug;can_read"
              sort-columns="entity_name" query-rows="25" quick-filter="yes" row-height="medium"
              select-all-checkbox="true" pageable="yes" auto-adjust="true" virtual-scroll="yes" insert-button="yes"
              delete-button="yes" fixed-header="true" class="vertical-padding-8" edition-mode="dblclick"
              horizontal-scroll="yes" class="fill-form">

              <o-table-column attr="entity_name" title="entity_name">
              </o-table-column>


              <o-table-column attr="role_name" title="role_name">
              </o-table-column>

              <o-table-column #can_read attr="can_read" title="can_read" editable="no" required="no"
                content-align="left">
                <o-table-cell-renderer-boolean render-true-value="check_circle" render-false-value="highlight_off"
                  render-type="icon" boolean-type="boolean" true-value="true"
                  false-value="false"></o-table-cell-renderer-boolean>
              </o-table-column>

              <o-table-column #can_insert attr="can_insert" title="can_insert" editable="no" required="no"
                content-align="left">
                <o-table-cell-renderer-boolean render-true-value="check_circle" render-false-value="highlight_off"
                  render-type="icon" boolean-type="boolean" true-value="true"
                  false-value="false"></o-table-cell-renderer-boolean>
              </o-table-column>

              <o-table-column #can_update attr="can_update" label="can_update" editable="no"
                required="no" content-align="left">
                <o-table-cell-renderer-boolean render-true-value="check_circle" render-false-value="highlight_off"
                  render-type="icon" boolean-type="boolean" true-value="true"
                  false-value="false"></o-table-cell-renderer-boolean>
              </o-table-column>

              <o-table-column #can_delete attr="can_delete" title="can_delete" editable="no" required="no"
                content-align="left">
                <o-table-cell-renderer-boolean render-true-value="check_circle" render-false-value="highlight_off"
                  render-type="icon" boolean-type="boolean" true-value="true"
                  false-value="false"></o-table-cell-renderer-boolean>
              </o-table-column>

              <o-table-column #filter attr="filter" title="filter" editable="no" required="no"
                content-align="left"></o-table-column>

              <o-table-column #filter_debug attr="filter_debug" title="filter_debug" editable="no" required="no"
                content-align="left"></o-table-column>



              <o-table-paginator page-size-options="25;50;100"></o-table-paginator>
            </o-table>
          </div>
        </mat-tab>

      </mat-tab-group>

    </o-form>
  </o-form-container>
</div>
