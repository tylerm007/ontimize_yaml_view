<div class="container">
<o-form-container breadcrumb="yes" breadcrumb-label-columns="menu_name" breadcrumb-separator=", " class="fill-form">
      <o-form #form attr="MenuGroup_form_edit" 
        service="MenuGroup" 
        entity="MenuGroup" 
        fxLayout="column" 
        show-header="yes" 
        header-actions="R;I;U;D"
        #oDetailForm keys="id" 
        keys-sql-types="INTEGER" 
        show-header-navigation="yes"
        (onDataLoaded)="onDataLoaded($event)">

  <o-row attr="row1" layout-align="start stretch">
    <div fxLayout="row wrap" fxLayoutAlign="start start" fxFlex fxLayoutGap="14px">
      
      <o-text-input #menu_name attr="menu_name" label=" menu_name" enabled="yes" required="yes" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-list-picker 
        attr="application_id"
        service="Application" 
        entity="ApplicationType"
        fxFlex="30" 
        query-on-init="no" 
        query-on-bind="yes" 
        required="yes" 
        enabled="yes" 
        filter="yes"
        value-column="id" 
        value-column-type="BIGINT"  
        keys="id" 
        columns="id;application_id;name" 
        title="application_id"
        visible-columns="id;name" 
        separator=" - " width="680px" class="form-field">
</o-list-picker>
      
      <o-text-input #menu_title attr="menu_title" label="menu_title" enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-text-input #icon attr="icon" label="icon" enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-integer-input #id attr="id" label="id" type="integer" editable="no" required="yes" ></o-integer-input>
      
      <o-checkbox #opened attr="opened" label="opened" read-only="no" enabled="yes"></o-checkbox>
      
    </div>
  </o-row>
      
      <mat-tab-group fxFill>
        
        <mat-tab label="MENUITEM-menu_group_id">
    <div layout-padding>
      <o-table 
        attr="MenuItemTable" 
        service="MenuItem" 
        entity="MenuItem" 
        keys="id"
        parent-keys="menu_group_id:id"
        columns="entity_name;menu_group_id;template_name;menu_name;icon;id"  
        horizontal-scroll="yes"
        detail-form-route="MenuItem" 
        edit-form-route="MenuItem"
        visible-columns="entity_name;menu_group_id;template_name;menu_name;icon;id"  
        sort-columns="entity_name" 
        query-rows="25" 
        quick-filter="yes"
        row-height="medium" 
        select-all-checkbox="true" 
        pageable="yes"  
        auto-adjust="true" 
        virtual-scroll="yes" 
        insert-button="yes" 
        delete-button="yes" 
        fixed-header="true" 
        class="vertical-padding-8"
        edition-mode="dblclick" 
        horizontal-scroll="yes" class="fill-form">
        
          <o-table-column #entity_name attr="entity_name" title=" entity_name" editable="no" required="yes" content-align="left"></o-table-column>
        
          <o-table-column attr="menu_group_id" title="menu_group_id">
    <o-table-cell-renderer-service attr="menu_group_id" 
        service="MenuGroup" entity="MenuGroupType" columns="id;menu_name"
        parent-keys="id:menu_group_id"
        value-column="menu_name" keys="menu_group_id"
        visible-columns="menu_name" separator=" - " width="680px">
    </o-table-cell-renderer-service>
</o-table-column>
        
          <o-table-column #template_name attr="template_name" title="template_name" editable="no" required="no" content-align="left"></o-table-column>
        
          <o-table-column #menu_name attr="menu_name" title="menu_name" editable="no" required="yes" content-align="left"></o-table-column>
        
          <o-table-column #icon attr="icon" title="icon" editable="no" required="no" content-align="left"></o-table-column>
        
          <o-table-column #id attr="id" title="id" type="integer" editable="no" required="yes" content-align="center"></o-table-column>
        
        <o-table-paginator page-size-options="25;50;100"></o-table-paginator>
      </o-table>
    </div>
</mat-tab>
        
      </mat-tab-group>
      
    </o-form>
  </o-form-container>
</div>
