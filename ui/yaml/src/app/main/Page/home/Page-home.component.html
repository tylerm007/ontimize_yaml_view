<o-form-layout-manager attr="Page" mode="tab" title="PAGE">
    <div fxFill fxLayout="column" fxLayoutAlign="start">
        <o-table 
            attr="PageTable" 
            service="Page" 
            entity="Page" 
            title="PAGE"
            keys="id"
            columns="page_name;menu_item_id;template_name;title;typescript_name;columns;visible_columns;include_children;id" 
            header-actions="R;D"
            visible-columns="page_name;menu_item_id;template_name;title;typescript_name;columns;visible_columns;include_children;id"  
            sort-columns="page_name" 
            query-rows="20" 
            quick-filter="yes"
            row-height="medium" 
            select-all-checkbox="true" 
            pageable="yes"  
            auto-adjust="true" 
            virtual-scroll="yes" 
            edition-mode="dblclick"
            horizontal-scroll="yes"
            show-title="yes"
            export-button="yes">
            
            <o-table-column #page_name attr="page_name" title=" page_name" editable="no" required="yes" content-align="left"></o-table-column>
            
            <o-table-column attr="menu_item_id" title="menu_item_id">
    <o-table-cell-renderer-service attr="menu_item_id" 
        service="MenuItem" entity="MenuItemType" columns="id;entity_name"
        parent-keys="id:menu_item_id"
        value-column="entity_name" keys="menu_item_id"
        visible-columns="entity_name" separator=" - " width="680px">
    </o-table-cell-renderer-service>
</o-table-column>
            
            <o-table-column #template_name attr="template_name" title="template_name" editable="no" required="no" content-align="left"></o-table-column>
            
            <o-table-column #title attr="title" title="title" editable="no" required="no" content-align="left"></o-table-column>
            
            <o-table-column #typescript_name attr="typescript_name" title="typescript_name" editable="no" required="no" content-align="left"></o-table-column>
            
            <o-table-column #columns attr="columns" title="columns" editable="no" required="no" content-align="left"></o-table-column>
            
            <o-table-column #visible_columns attr="visible_columns" title="visible_columns" editable="no" required="no" content-align="left"></o-table-column>
            
            <o-table-column attr="include_children" title="include_children">
    <o-table-cell-renderer-boolean render-true-value="check_circle" render-false-value="highlight_off"
        render-type="icon" boolean-type="boolean" true-value="true" false-value="false"></o-table-cell-renderer-boolean>
</o-table-column>
            
            <o-table-column #id attr="id" title="id" type="integer" editable="no" required="yes" content-align="center"></o-table-column>
            
            <o-table-context-menu></o-table-context-menu>
            <o-table-paginator page-size-options="24;48;96"></o-table-paginator>
        </o-table>
    </div>
</o-form-layout-manager>
