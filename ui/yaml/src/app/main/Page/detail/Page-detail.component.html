<div class="container">
  <o-form-container breadcrumb="yes" breadcrumb-label-columns="page_name" breadcrumb-separator=", " class="fill-form">
    <o-form #form attr="Page_form_edit" service="Page" entity="Page" fxLayout="column" show-header="yes"
      header-actions="R;U;D" #oDetailForm keys="id" keys-sql-types="INTEGER" show-header-navigation="yes"
      (onDataLoaded)="onDataLoaded($event)">

      <o-row attr="row1" layout-align="start stretch">
        <div fxLayout="row wrap" fxLayoutAlign="start start" fxFlex fxLayoutGap="14px">

          <o-text-input #page_name attr="page_name" label=" page_name" enabled="yes" required="yes" fxFlex="20%"
            class="form-field"></o-text-input>

          <o-list-picker attr="menu_item_id" service="MenuItem" entity="MenuItemType" fxFlex="30" query-on-init="no"
            query-on-bind="yes" required="yes" enabled="yes" filter="yes" value-column="id" value-column-type="BIGINT"
            keys="id" columns="id;menu_item_id;entity_name" title="menu_item_id" visible-columns="id;entity_name"
            separator=" - " width="680px" class="form-field">
          </o-list-picker>

          <o-list-picker attr="template_name" service="Template" entity="TemplateType" fxFlex="30" query-on-init="no"
            query-on-bind="yes" required="no" enabled="yes" filter="yes" value-column="name" value-column-type="VARCHAR"
            keys="name" columns="name;template_name;name" title="template_name" visible-columns="name;name"
            separator=" - " width="680px" class="form-field">
          </o-list-picker>

          <o-text-input #title attr="title" label="title" enabled="yes" required="no" fxFlex="20%"
            class="form-field"></o-text-input>

          <o-text-input #typescript_name attr="typescript_name" label="typescript_name" enabled="yes" required="no"
            fxFlex="20%" class="form-field"></o-text-input>
        </div>
      </o-row>
      <o-row attr="row2" layout-align="center center">
        <o-textarea-input #columns attr="columns" label="columns" enabled="no" required="no" fxFlex="100%"
          class="form-field"></o-textarea-input>
      </o-row>
      <o-row attr="row3" layout-align="center center">
        <o-textarea-input #visible_columns attr="visible_columns" label="visible_columns" enabled="yes" required="no"
          fxFlex="100%" class="form-field"></o-textarea-input>
      </o-row>

      <!-- o-integer-input #id attr="id" label="id" type="integer" editable="no" required="yes" visible="no"></o-integer-input -->

      <o-button attr="reorder_button" label="Reorder Visible Columns" type="raised" fxFlex="20%" color="primary"
        (click)="openReorderDialog()"></o-button>
      <o-checkbox #include_children attr="include_children" label="include_children" read-only="no"
        enabled="yes"></o-checkbox>

      <mat-tab-group fxFill>

        <mat-tab label="PAGEPROPERTY-page_id">
          <div layout-padding>
            <o-table attr="PagePropertyTable" service="PageProperty" entity="PageProperty" keys="id"
              parent-keys="page_id:id" columns="property_name;page_id;property_value;property_type;id"
              horizontal-scroll="yes" detail-form-route="PageProperty" edit-form-route="PageProperty"
              visible-columns="property_name;property_value;property_type" sort-columns="property_name" query-rows="5"
              quick-filter="no" row-height="medium" select-all-checkbox="false" pageable="yes" auto-adjust="true"
              virtual-scroll="yes" insert-button="yes" delete-button="yes" fixed-header="true" class="vertical-padding-8"
              edition-mode="dblclick" horizontal-scroll="yes" class="fill-form">

              <o-table-column #property_name attr="property_name" title=" property_name" editable="no" required="yes"
                content-align="left"></o-table-column>

              <!-- o-table-column attr="page_id" title="page_id">
    <o-table-cell-renderer-service attr="page_id" 
        service="Page" entity="PageType" columns="id;page_name"
        parent-keys="id:page_id"
        value-column="page_name" keys="page_id"
        visible-columns="page_name" separator=" - " width="680px">
    </o-table-cell-renderer-service>
</o-table-column -->

              <o-table-column #property_value attr="property_value" title="property_value" editable="no" required="no"
                content-align="left"></o-table-column>

              <o-table-column #property_type attr="property_type" title="property_type" editable="no" required="no"
                content-align="left"></o-table-column>

              <!-- o-table-column #id attr="id" title="id" type="integer" editable="no" required="yes" content-align="center"></o-table-column -->

              <o-table-paginator page-size-options="25;50;100"></o-table-paginator>
            </o-table>
          </div>
        </mat-tab>

      </mat-tab-group>

    </o-form>
  </o-form-container>
</div>
