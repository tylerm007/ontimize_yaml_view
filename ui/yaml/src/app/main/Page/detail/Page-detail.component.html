<div class="container">
<o-form-container breadcrumb="yes" breadcrumb-label-columns="page_name" breadcrumb-separator=", " class="fill-form">
      <o-form #form attr="Page_form_edit" 
        service="Page" 
        entity="Page" 
        fxLayout="column" 
        show-header="yes" 
        header-actions="R;U;D"
        #oDetailForm keys="id" 
        keys-sql-types="INTEGER" 
        show-header-navigation="yes"
        (onDataLoaded)="onDataLoaded($event)">

  <o-row attr="row1" layout-align="start stretch">
    <div fxLayout="row wrap" fxLayoutAlign="start start" fxFlex fxLayoutGap="14px">
      
      <o-text-input #page_name attr="page_name" label=" page_name" enabled="yes" required="yes" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-list-picker 
        attr="menu_item_id"
        service="MenuItem" 
        entity="MenuItemType"
        fxFlex="30" 
        query-on-init="no" 
        query-on-bind="yes" 
        required="yes" 
        enabled="yes" 
        filter="yes"
        value-column="id" 
        value-column-type="BIGINT"  
        keys="id" 
        columns="id;menu_item_id;entity_name" 
        title="menu_item_id"
        visible-columns="id;entity_name" 
        separator=" - " width="680px" class="form-field">
</o-list-picker>
      
      <o-list-picker 
        attr="template_name"
        service="Template" 
        entity="TemplateType"
        fxFlex="30" 
        query-on-init="no" 
        query-on-bind="yes" 
        required="no" 
        enabled="yes" 
        filter="yes"
        value-column="name" 
        value-column-type="VARCHAR"  
        keys="name" 
        columns="name;template_name;name" 
        title="template_name"
        visible-columns="name;name" 
        separator=" - " width="680px" class="form-field">
</o-list-picker>
      
      <o-text-input #title attr="title" label="title" enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
      
      <o-text-input #typescript_name attr="typescript_name" label="typescript_name" enabled="yes" required="no" fxFlex="20%" class="form-field"></o-text-input>
    </div>
  </o-row>
      <o-row attr="row2" layout-align="center center">
        <o-textarea-input #columns attr="columns" label="columns" enabled="no" required="no" fxFlex="100%" class="form-field"></o-textarea-input>
      </o-row>
      <o-row attr="row3" layout-align="center center">
        <o-textarea-input #visible_columns attr="visible_columns" label="visible_columns" enabled="yes" required="no" fxFlex="100%" class="form-field"></o-textarea-input>
      </o-row>
      <o-checkbox #include_children attr="include_children" label="include_children" read-only="no" enabled="yes"></o-checkbox>
      
      <!-- o-integer-input #id attr="id" label="id" type="integer" editable="no" required="yes" visible="no"></o-integer-input -->
      

      
      <mat-tab-group fxFill>
        
      </mat-tab-group>
      
    </o-form>
  </o-form-container>
</div>
