
<o-form #YamlFilesForm attr="YamlFiles_form_insert" service="YamlFiles" entity="YamlFiles" title="Import Yaml File" show-title="yes"
keys="name" fxLayout="column" show-header="yes" header-actions="I" show-header-title="no" show-header-description="no"
horizontal-scroll="no" show-header-navigation="no" after-insert-mode="home" class="standalone-form-container" (onInsertMode)="onInsertMode()">

<o-row attr="row1" layout-align="start stretch">
  <!-- o-filemanager-table service="YamlFiles" workspace-key="content" new-folder-button="no" download="yes"></o-filemanager-table -->
  <div fxLayout="row wrap" fxLayoutAlign="start start" fxFlex fxLayoutGap="14px">
        <o-text-input attr="name" label=" name*" enabled="yes" required="yes" fxFlex="20%" class="form-field"></o-text-input>
  </div>
</o-row>
<div layout-padding align="left">
<h1>ApiLogicServer Folder upload</h1>

<label for="folder">Select ApilogicServer project (root folder):</label>
<input type="file" id="folder" webkitdirectory multiple/>

</div>
<div align="'center">OR</div>
<o-row attr="row1" layout-align="start stretch">

  <o-image attr="content" type="image" label="Select ${root}/ui/{app}/app_model.yaml" sql-type="TEXT" auto-fit="true" enabled="true" 
  read-only="false" show-controls="true"  
  tooltip="Select an app_model.yaml file from your ApiLogicServer project."
  full-screen-button="false" accept-file-type="*.yaml" empty-image="./assets/images/no-image.png">
</o-image>
<o-image attr="rule_content" type="image" label="select $[root}/logic/declare_logic.py" sql-type="TEXT" auto-fit="true" enabled="true" 
  read-only="false" show-controls="true"  
  tooltip="Select an /logic/declare_logic.py file from your ApiLogicServer project."
  full-screen-button="false" accept-file-type="*.py" empty-image="./assets/images/no-image.png">
</o-image>
<o-image attr="role_content" type="image" label="select $[root}/security/declare_security.py" sql-type="TEXT" auto-fit="true" enabled="true" 
  read-only="false" show-controls="true"  
  tooltip="Select an /security/declare_security.py file from your ApiLogicServer project."
  full-screen-button="false" accept-file-type="*.py" empty-image="./assets/images/no-image.png">
</o-image>
</o-row>

</o-form>
