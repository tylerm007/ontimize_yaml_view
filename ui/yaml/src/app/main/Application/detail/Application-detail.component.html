<div class="container">
  <o-form-container breadcrumb="yes" breadcrumb-label-columns="name" breadcrumb-separator=", " class="fill-form">
    <o-form #form attr="Application_form_edit" service="Application" entity="Application" fxLayout="column"
      show-header="yes" header-actions="R;I;U;D" #oDetailForm keys="name" keys-sql-types="VARCHAR"
      show-header-navigation="yes" (onDataLoaded)="onDataLoaded($event)">

      <o-row attr="row1" layout-align="start stretch">
        <div fxLayout="row wrap" fxLayoutAlign="start start" fxFlex fxLayoutGap="14px">

          <o-text-input #name attr="name" label=" name*" enabled="yes" required="yes" fxFlex="20%"
            class="form-field"></o-text-input>

          <o-text-input #app_short_name attr="app_short_name" label="app_short_name" enabled="yes" required="no"
            fxFlex="20%" class="form-field"></o-text-input>

          <o-text-input #description attr="description" label="description" enabled="yes" required="no" fxFlex="20%"
            class="form-field"></o-text-input>

          <o-textarea-input #app_yaml attr="app_yaml" label="app_yaml" enabled="yes" required="no" fxFlex="60%"
            class="form-field"></o-textarea-input>

        </div>
      </o-row>

      <mat-tab-group fxFill>

        <mat-tab label="APPLICATIONENTITY-application_name">
          <div layout-padding>
            <o-table attr="ApplicationEntityTable" service="ApplicationEntity" entity="ApplicationEntity"
              keys="application_name;entity_name" parent-keys="application_name:name"
              columns="application_name;entity_name" horizontal-scroll="yes" detail-form-route="ApplicationEntity"
              edit-form-route="ApplicationEntity" visible-columns="application_name;entity_name"
              sort-columns="application_name" query-rows="25" quick-filter="yes" row-height="medium"
              select-all-checkbox="true" pageable="yes" auto-adjust="true" virtual-scroll="yes" insert-button="yes"
              delete-button="yes" fixed-header="true" class="vertical-padding-8" edition-mode="dblclick"
              horizontal-scroll="yes" class="fill-form">

              <o-table-column attr="application_name" title="application_name">
      
              </o-table-column>

              <o-table-column attr="entity_name" title="entity_name">
              </o-table-column>
              <o-checkbox #include_parent  label="Include Parent" enabled="yes" required="no" fxFlex="10%"
                class="form-field"></o-checkbox>
              <o-checkbox #include_children  label="Include Children" enabled="yes" required="no" fxFlex="10%"
                class="form-field"></o-checkbox>
              <o-table-paginator page-size-options="25;50;100"></o-table-paginator>
            </o-table>
          </div>
        </mat-tab>

      </mat-tab-group>

    </o-form>
  </o-form-container>
</div>
