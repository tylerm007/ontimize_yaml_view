<div class="container">
  <o-form-container breadcrumb="yes" breadcrumb-label-columns="entity_name" breadcrumb-separator=", " class="fill-form">
    <o-form #form attr="MenuItem_form_edit" service="MenuItem" entity="MenuItem" fxLayout="column" show-header="yes"
      header-actions="R;U;D" #oDetailForm keys="id" keys-sql-types="INTEGER" show-header-navigation="yes"
      (onDataLoaded)="onDataLoaded($event)">

      <o-row attr="row1" layout-align="start stretch">
        <div fxLayout="row wrap" fxLayoutAlign="start start" fxFlex fxLayoutGap="14px">

          <o-list-picker attr="entity_name" service="Entity" entity="EntityType" fxFlex="30" query-on-init="no"
            query-on-bind="yes" required="yes" enabled="yes" filter="yes" value-column="name"
            value-column-type="VARCHAR" keys="name" columns="name;entity_name;name" title="entity_name"
            visible-columns="name;name" separator=" - " width="680px" class="form-field">
          </o-list-picker>

          <o-list-picker attr="menu_group_id" service="MenuGroup" entity="MenuGroupType" fxFlex="30" query-on-init="no"
            query-on-bind="yes" required="yes" enabled="yes" filter="yes" value-column="id" value-column-type="BIGINT"
            keys="id" columns="id;menu_group_id;menu_name" title="menu_group_id" visible-columns="id;menu_name"
            separator=" - " width="680px" class="form-field">
          </o-list-picker>

          <o-list-picker attr="template_name" service="Template" entity="TemplateType" fxFlex="30" query-on-init="no"
            query-on-bind="yes" required="no" enabled="yes" filter="yes" value-column="name" value-column-type="VARCHAR"
            keys="name" columns="name;template_name;name" title="template_name" visible-columns="name;name"
            separator=" - " width="680px" class="form-field">
          </o-list-picker>

          <o-text-input #menu_name attr="menu_name" label="menu_name" enabled="yes" required="yes" fxFlex="20%"
            class="form-field"></o-text-input>

          <o-text-input #icon attr="icon" label="icon" enabled="yes" required="no" fxFlex="20%"
            class="form-field"></o-text-input>

          <o-integer-input #id attr="id" label="id" type="integer" editable="no" required="yes"></o-integer-input>
          <o-button #rebuild_item label="Rebuild Menu Item" type="raised" fxFlex="20%" color="primary"
          (click)="rebuildMenuItem()"></o-button>
        </div>
      </o-row>

      <mat-tab-group fxFill>

        <mat-tab label="PAGE-menu_item_id">
          <div layout-padding>
            <o-table attr="PageTable" service="Page" entity="Page" keys="id" parent-keys="menu_item_id:id"
              columns="page_name;menu_item_id;template_name;title;typescript_name;columns;visible_columns;include_children;id"
              horizontal-scroll="yes" detail-form-route="Page" edit-form-route="Page"
              visible-columns="page_name;menu_item_id;template_name;title;typescript_name;columns;visible_columns;include_children;id"
              sort-columns="page_name" query-rows="25" quick-filter="yes" row-height="medium" select-all-checkbox="true"
              pageable="yes" auto-adjust="true" virtual-scroll="yes" insert-button="yes" delete-button="yes"
              fixed-header="true" class="vertical-padding-8" edition-mode="dblclick" horizontal-scroll="yes"
              class="fill-form">

              <o-table-column #page_name attr="page_name" title=" page_name" editable="no" required="yes"
                content-align="left"></o-table-column>

              <o-table-column attr="menu_item_id" title="menu_item_id">
                <o-table-cell-renderer-service attr="menu_item_id" service="MenuItem" entity="MenuItemType"
                  columns="id;entity_name" parent-keys="id:menu_item_id" value-column="entity_name" keys="menu_item_id"
                  visible-columns="entity_name" separator=" - " width="680px">
                </o-table-cell-renderer-service>
              </o-table-column>

              <o-table-column #template_name attr="template_name" title="template_name" editable="no" required="no"
                content-align="left"></o-table-column>

              <o-table-column #title attr="title" title="title" editable="no" required="no"
                content-align="left"></o-table-column>

              <o-table-column #typescript_name attr="typescript_name" title="typescript_name" editable="no"
                required="no" content-align="left"></o-table-column>

              <o-table-column #columns attr="columns" title="columns" editable="no" required="no"
                content-align="left"></o-table-column>

              <o-table-column #visible_columns attr="visible_columns" title="visible_columns" editable="no"
                required="no" content-align="left"></o-table-column>

              <o-table-column attr="include_children" title="include_children">
                <o-table-cell-renderer-boolean render-true-value="check_circle" render-false-value="highlight_off"
                  render-type="icon" boolean-type="boolean" true-value="true"
                  false-value="false"></o-table-cell-renderer-boolean>
              </o-table-column>

              <o-table-column #id attr="id" title="id" type="integer" editable="no" required="yes"
                content-align="center"></o-table-column>
            </o-table>
            
          </div>

        </mat-tab>

      </mat-tab-group>

    </o-form>
  </o-form-container>
</div>
