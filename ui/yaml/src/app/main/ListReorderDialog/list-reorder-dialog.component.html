<h2 mat-dialog-title>Reorder or remove Visible Columns</h2>
<mat-dialog-content>
    <div class="list-container">
        <div cdkDropList class="item-list" (cdkDropListDropped)="drop($event)">
            <div *ngFor="let item of items; let i = index" cdkDrag class="item-box">
                <div class="drag-handle">
                    <mat-icon>drag_indicator</mat-icon>
                </div>
                <mat-form-field appearance="outline" class="item-input">
                    <input matInput [(ngModel)]="item.value" placeholder="Item value">
                </mat-form-field>
                <button mat-icon-button type="button" (click)="toggleVisibility(item)"
                    [attr.aria-label]="item.visible ? 'Hide item' : 'Show item'">
                    <mat-icon>{{ item.visible ? 'visibility' : 'visibility_off' }}</mat-icon>
                </button>
                <button mat-icon-button type="button" (click)="removeItem(i)" aria-label="Remove item">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
        </div>
        <button mat-stroked-button type="button" (click)="addItem()" class="add-item-button">
            <mat-icon>add</mat-icon> Add Item
        </button>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="button" (click)="onSave()">Save</button>
</mat-dialog-actions>
