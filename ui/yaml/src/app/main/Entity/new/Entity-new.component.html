<o-form #EntityForm attr="Entity_form_insert" service="Entity" entity="Entity" 
keys="name" fxLayout="column" show-header="yes" header-actions="I"
horizontal-scroll="yes"
after-insert-mode="new" class="standalone-form-container" (onInsertMode)="onInsertMode()">

  <o-row attr="row1" layout-align="start stretch">
    <div fxLayout="row wrap" fxLayoutAlign="start start" fxFlex fxLayoutGap="14px">

      <div fxLayout="row" fxLayoutAlign="start center" class="gap">
        <o-text-input attr="name" label=" Entity Name*" editable="yes" required="yes"></o-text-input>
      </div>

      <div fxLayout="row" fxLayoutAlign="start center" class="gap">
        <o-text-input attr="title" label="Title" editable="yes" required="no"></o-text-input>
      </div>

      <div fxLayout="row" fxLayoutAlign="start center" class="gap">
        <o-text-input attr="pkey" label="Primary Key" editable="yes" required="no"></o-text-input>
      </div>

      <div fxLayout="row" fxLayoutAlign="start center" class="gap">
        <o-text-input attr="favorite" label="Favorite" editable="yes" required="no"></o-text-input>
      </div>
      <!-- div fxLayout="row" fxLayoutAlign="start center" class="gap">

      <div fxLayout="row" fxLayoutAlign="start center" class="gap">
        <o-text-input #mode  attr="mode" label="Mode" tooltip="tab or dialog" editable="yes" required="no"></o-text-input>
      </div>
      <div fxLayout="row" fxLayoutAlign="start center" class="gap">
        <o-text-input #menu_group attr="menu_group" label="Menu Group" read-only="no" enabled="yes"></o-text-input>
      </div -->

      <div fxLayout="row" fxLayoutAlign="start center" class="gap">
        <o-textarea-input attr="info_list" label="Info List" enabled="true" read-only="false"></o-textarea-input>
      </div>

      <div fxLayout="row" fxLayoutAlign="start center" class="gap">
        <o-textarea-input attr="info_show" label="Info Show" enabled="true" read-only="false"></o-textarea-input>
      </div>
	  <o-checkbox #mcp_get attr="mcp_get" label="mcp_get" read-only="no" enabled="yes"></o-checkbox>
      
        <o-checkbox #mcp_post attr="mcp_post" label="mcp_post" read-only="no" enabled="yes"></o-checkbox>
      
        <o-checkbox #mcp_delete attr="mcp_delete" label="mcp_delete" read-only="no" enabled="yes"></o-checkbox>
      
        <o-checkbox #mcp_patch attr="mcp_patch" label="mcp_patch" read-only="no" enabled="yes"></o-checkbox>
      
        <o-checkbox #mcp_enabled attr="mcp_enabled" label="mcp_enabled" read-only="no" enabled="yes"></o-checkbox>
      
    </div>
  </o-row>

  <div layout-padding></div>

</o-form>
